llm:
  provider: ollama
  model: llama3.2
  temperature: 0.7
  max_tokens: 2048
  options:
    num_ctx: 4096

openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.openai.com/v1"
  model: gpt-4o-mini

tts:
  enabled: true
  provider: piper
  voice_model: "voices/Female/en_US-hfc_female-medium.onnx"
  piper_binary: "piper"

preprocessing:
  enabled: true

moderation:
  enabled: false

persona:
  prompt_file: "api/prompts/herta.txt"
